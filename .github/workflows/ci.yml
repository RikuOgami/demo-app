name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CỔNG 1: Chạy test
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  # CỔNG 2: Build Docker image
  build:
    name: 🐳 Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t demo-app .

  # CỔNG 3: Quét bảo mật
  security:
    name: 🔒 Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image để scan
        run: docker build -t demo-app .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: demo-app
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
